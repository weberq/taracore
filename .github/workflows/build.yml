name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_instrumented:
        description: "Also run instrumented tests on an emulator (slow)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          # llama.cpp is a submodule. Without this the CMake configure step fails
          # with an explicit message rather than something cryptic, but it still fails.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" \
                               "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache the native build
        # Compiling ggml and llama.cpp is the bulk of a cold build. Keyed on the
        # submodule commit and the CMake inputs, so a pin bump correctly misses.
        uses: actions/cache@v4
        with:
          path: engine/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('.gitmodules', 'engine/src/main/cpp/**') }}-${{ hashFiles('third_party/llama.cpp/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew testCpuDebugUnitTest --stacktrace

      - name: Build every module (cpu flavour)
        run: ./gradlew assembleCpuDebug --stacktrace

      - name: Verify 16 KB page alignment
        # A regression here is invisible until the app is installed on a 16 KB-page
        # device, where it simply fails to load. Catch it in CI instead.
        run: |
          set -euo pipefail
          READELF="$(find "$ANDROID_HOME/ndk" -name llvm-readelf -type f | head -1)"
          SO="$(find engine/build -path '*arm64-v8a*' -name 'libtaracore_jni.so' | head -1)"
          echo "checking $SO"
          test -n "$SO" || { echo "no arm64 .so was produced"; exit 1; }
          BAD="$("$READELF" -l "$SO" | awk '/LOAD/ { if ($NF != "0x4000") print }')"
          if [ -n "$BAD" ]; then
            echo "LOAD segments are not 16 KB aligned:"
            echo "$BAD"
            exit 1
          fi
          echo "all LOAD segments align at 0x4000"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            sample-client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  instrumented:
    # Opt-in: an emulator run plus a model download takes far longer than the rest
    # of the pipeline, and every test skips cleanly without weights anyway.
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch a tiny model
        run: ./scripts/fetch-model.sh --tiny --no-push

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented engine tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb shell mkdir -p /sdcard/Android/data/dev.taracore.engine.test/files/models || true
            adb push build/models/*.gguf /sdcard/Android/data/dev.taracore.engine.test/files/models/
            ./gradlew :engine:connectedCpuDebugAndroidTest

navigationCompose = "2.8.5"
room = "2.6.1"
work = "2.10.0"
okhttp = "4.12.0"
ktor = "2.3.13"
coroutines = "1.9.0"
serialization = "1.7.3"
datastore = "1.1.1"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
